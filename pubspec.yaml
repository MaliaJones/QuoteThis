name: andrea_app_v2
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.3.3
  flutter_svg: ^2.0.9
  provider: ^6.0.0
  implicitly_animated_reorderable_list: ^0.4.0
  material_symbols_icons: ^4.2874.0
  dotted_line: ^3.2.3
  fl_chart: ^1.1.1
  auto_size_text: ^3.0.0
  flip_card: ^0.6.0
  flutter_staggered_grid_view: ^0.7.0
  csv: ^6.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.6
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/QuoteThisLogo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/icon/QuoteThisLogo.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/icon/QuoteThisLogo.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/icon/QuoteThisLogo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/quotes_db.csv
